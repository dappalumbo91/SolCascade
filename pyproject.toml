[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solcascade"
version = "0.1.0"
description = "Modular local simulation of staged magnetic compression, shell radiation transport, and direct conversion of a deuterium-tritium fusion pulse."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Damian Arthur Palumbo" }]
keywords = ["fusion", "openmc", "moose", "neutronics", "direct-energy-conversion"]
dependencies = [
  "numpy>=2",
  "scipy>=1.11",
  "pyyaml>=6",
]

[project.optional-dependencies]
openmc = ["openmc>=0.14"]
gpu = ["cupy"]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.8"]

[project.scripts]
solcascade = "solcascade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
