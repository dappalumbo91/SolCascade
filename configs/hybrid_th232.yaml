name: hybrid-th232
description: >
  The checked-in four-coil pulse with a Th-232 metal zone wrapped outside
  the steel. Lithium-lead stays the breeder. The analytical fission count
  is a first-collision surrogate. OpenMC is the cascade. This file does
  not run the 100-pulse depletion; that schedule is on hybrid_u238.yaml.

materials_file: materials.yaml

provider:
  overrides: {}

geometry:
  coils:
    - name: mirror_inner_minus
      radius_m: 0.50
      z_m: -0.28
      turns: 12
      current_a: 40000.0
      wire_radius_m: 0.008
      material: copper
    - name: mirror_inner_plus
      radius_m: 0.50
      z_m: 0.28
      turns: 12
      current_a: 40000.0
      wire_radius_m: 0.008
      material: copper
    - name: mirror_outer_minus
      radius_m: 0.62
      z_m: -0.48
      turns: 16
      current_a: 40000.0
      wire_radius_m: 0.008
      material: copper
    - name: mirror_outer_plus
      radius_m: 0.62
      z_m: 0.48
      turns: 16
      current_a: 40000.0
      wire_radius_m: 0.008
      material: copper
  shell:
    inner_radius_m: 0.20
    radial_cells: 24
    layers:
      - {name: first_wall, material: tungsten, thickness_m: 0.004}
      - {name: absorber, material: lithium_lead, thickness_m: 0.12}
      - {name: structure, material: steel_316, thickness_m: 0.015}

compression:
  time_s: [0.0, 0.0005, 0.0020, 0.0030, 0.0035]
  plasma_radius_m: [0.05, 0.035, 0.018, 0.018, 0.05]
  coil_current_scale: [0.15, 0.55, 1.0, 1.0, 0.15]
  substeps_per_interval: 8
  flux_conservation: frozen_axial_flux

plasma:
  ion_density_m3: 1.0e20
  ion_temperature_keV: 0.5
  electron_temperature_equals_ion: true
  deuterium_fraction: 0.5

transport:
  backend: auto
  execute: true
  openmc:
    particles: 200
    batches: 10
    photon_transport: false
    seed: 1
    threads: null
    executable: null

field:
  method: elliptic
  array_backend: numpy
  grid_nr: 21
  grid_nz: 21
  grid_r_max_m: 0.9
  grid_z_max_m: 0.8

heat:
  time_steps: 8
  sink_temperature_K: 600.0
  outer_heat_transfer_coefficient_W_m2K: 2000.0
  initial_temperature_K: 600.0
  execute_moose: true
  moose_executable: null

mechanics:
  stress_free_temperature_K: 600.0

conversion:
  alpha_escape_fraction: 0.25
  alpha_wall_fraction: 0.05
  alpha_direct_efficiency: 0.55
  shell_channel: none
  carnot_fraction: 0.0
  cold_temperature_K: 300.0
  coil_energy_recovery_fraction: 0.5
  conductor_temperature_K: 293.15
  thermal_efficiency: 0.33

blanket:
  fuel_type: th232
  thickness_m: 0.15
  density_g_cm3: 11.72
  enrichment: 1.0
  neutron_yield_scale: 1.0

fission:
  backend: none
  execute: false
  pulses: 0
  interpulse_s: 0.0

equilibrium:
  solver: vacuum
  tokamaker_mesh: null

output:
  workdir: runs/hybrid/th232
